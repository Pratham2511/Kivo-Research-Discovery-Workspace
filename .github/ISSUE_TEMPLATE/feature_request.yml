name: Feature request
description: Suggest an improvement to a research workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Research problem
      description: What task is currently difficult? Use public or synthetic examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the user-facing change and how it would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
